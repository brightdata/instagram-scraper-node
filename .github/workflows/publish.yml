# Publishes the package to npm when a GitHub Release is published.
# Release steps: bump "version" in package.json and VERSION in src/index.js,
# add a CHANGELOG.md entry, then publish a GitHub Release tagged v<version>.
#
# Auth: npm Trusted Publishing (OIDC), so no token is needed once a trusted
# publisher is set on npmjs.com. npm only allows that on a package that
# already exists, so the very first publish uses the NPM_TOKEN secret.
# Delete that secret after the trusted publisher is set.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@brightdata/instagram-scraper
    permissions:
      contents: read
      id-token: write  # Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"  # npm 11.5+, which Trusted Publishing needs
          registry-url: "https://registry.npmjs.org"
      - name: Check the release tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
      - name: Install, lint and test
        run: npm install && npm run lint && npm test
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}  # first publish only, see above
